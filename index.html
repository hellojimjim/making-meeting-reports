<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 회의록 작성기 — 화자 자동 구분</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
         max-width:1140px; margin:26px auto; padding:0 16px; background:#f7f8fa; color:#1a1a1a; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { font-size:13px; color:#64748b; margin-top:0; }
  button { padding:10px 16px; font-size:14px; border:none; border-radius:8px; cursor:pointer; }
  #start { background:#2563eb; color:#fff; } #stop { background:#dc2626; color:#fff; }
  .ghost { background:#e5e7eb; } button:disabled { opacity:.45; cursor:not-allowed; }
  select, input[type=text] { padding:8px 10px; border-radius:8px; border:1px solid #cbd5e1; background:#fff; font-size:14px; }

  .meta { background:#fff; border:1px solid #cbd5e1; border-radius:10px; padding:12px 14px;
          display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px; }
  @media (max-width:820px){ .meta{ grid-template-columns:1fr; } }
  .meta label { font-size:12px; color:#64748b; display:block; margin-bottom:4px; font-weight:600; }
  .meta input { width:100%; }

  .opts { border:1px solid #cbd5e1; border-radius:10px; padding:10px 14px; margin-bottom:10px;
          display:flex; gap:15px; align-items:center; flex-wrap:wrap; font-size:13px; background:#fff; }
  .opts.fmt { background:#eff6ff; border-color:#bfdbfe; }
  .opts.dia { background:#fff7ed; border-color:#fed7aa; }
  .opts.tr  { background:#f5f3ff; border-color:#ddd6fe; }
  .opts label { display:flex; align-items:center; gap:6px; }
  .tag { font-weight:700; color:#334155; }
  input[type=range] { width:92px; vertical-align:middle; }
  .collapsed { display:none !important; }

  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0 10px; }
  #status { font-size:13px; color:#64748b; margin-left:auto; }
  #timer { font-variant-numeric:tabular-nums; font-size:13px; color:#334155; font-weight:600;
           background:#fff; border:1px solid #cbd5e1; border-radius:8px; padding:8px 12px; }

  .grid { display:grid; gap:14px; grid-template-columns:1fr; }
  .grid.two { grid-template-columns:1fr 1fr; }
  @media (max-width:860px){ .grid.two{ grid-template-columns:1fr; } }
  .panel { background:#fff; border:1px solid #cbd5e1; border-radius:10px; display:flex; flex-direction:column; }
  .panel h2 { font-size:13px; margin:0; padding:10px 14px; border-bottom:1px solid #e5e7eb;
              color:#475569; font-weight:600; display:flex; justify-content:space-between; gap:8px; }
  .box { min-height:300px; max-height:470px; overflow-y:auto; padding:12px 14px; font-size:15px; line-height:1.8; }

  .para { margin:0 0 12px; } .para:last-child { margin-bottom:0; }
  .phead { font-size:11px; color:#94a3b8; font-weight:600; margin-bottom:2px; display:flex; align-items:center; gap:6px; }
  .spk { display:inline-block; font-size:11px; font-weight:700; color:#fff; background:#64748b;
         border-radius:4px; padding:1px 6px; cursor:pointer; }
  .s0{background:#2563eb}.s1{background:#059669}.s2{background:#d97706}.s3{background:#7c3aed}.s4{background:#db2777}
  .conf { font-size:10px; color:#cbd5e1; }
  .conf.low { color:#f59e0b; }
  .ts { font-size:11px; color:#94a3b8; font-variant-numeric:tabular-nums; }
  .line { display:block; }
  .line.action { background:#fef9c3; border-left:3px solid #eab308; padding-left:8px; border-radius:0 4px 4px 0; }
  .line.decision { background:#dcfce7; border-left:3px solid #22c55e; padding-left:8px; border-radius:0 4px 4px 0; }
  .seg { cursor:pointer; border-radius:4px; } .seg:hover { background:#eff6ff; }
  .seg.speaking { background:#fde68a; }
  .interim { color:#94a3b8; } .pending { color:#94a3b8; font-style:italic; }

  #err { color:#dc2626; font-size:14px; min-height:20px; }
  #warn { background:#fef3c7; border:1px solid #fcd34d; color:#92400e; font-size:13px;
          padding:10px 14px; border-radius:8px; margin-bottom:10px; display:none; line-height:1.6; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#cbd5e1; margin-right:6px; }
  .dot.on { background:#dc2626; animation:blink 1s infinite; }
  .dot.spk2 { background:#16a34a; animation:blink .7s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .savebar { border-top:1px solid #e5e7eb; padding:8px 10px; display:flex; gap:6px; flex-wrap:wrap; }
  .savebar button { padding:7px 12px; font-size:13px; background:#f1f5f9; }
  .spkbtns { display:flex; gap:4px; flex-wrap:wrap; }
  .spkbtns button { padding:6px 10px; font-size:12px; background:#f1f5f9; border:1px solid #e2e8f0; }
  .spkbtns button.active { background:#1e293b; color:#fff; border-color:#1e293b; }
  .legend { font-size:11px; color:#64748b; display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 0; }
  .chip { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }

  /* 등록 패널 */
  #enroll { background:#fff; border:1px solid #fed7aa; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .etable { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  .etable th, .etable td { text-align:left; padding:6px 8px; border-bottom:1px solid #f1f5f9; }
  .etable th { color:#64748b; font-size:11px; font-weight:600; }
  .pill { font-size:11px; padding:2px 7px; border-radius:99px; font-weight:600; }
  .pill.done { background:#dcfce7; color:#166534; }
  .pill.todo { background:#fee2e2; color:#991b1b; }
  #emeter { height:8px; background:#e5e7eb; border-radius:4px; overflow:hidden; margin-top:6px; }
  #ebar { height:100%; width:0%; background:#f97316; transition:width .08s; }
  .small { font-size:12px; color:#64748b; }
</style>
</head>
<body>
<h1>음성 회의록 작성기 <span style="font-size:13px;color:#f97316">· 화자 자동 구분</span></h1>
<p class="sub">브라우저 내장 기능만 사용 — 서버 전송·API 키 없음.</p>

<div id="warn"></div>

<div class="meta">
  <div><label>회의명</label><input type="text" id="mTitle" placeholder="예: 3분기 제품 기획 회의"></div>
  <div><label>참석자 (쉼표 구분)</label><input type="text" id="mAttend" placeholder="예: 김철수, 이영희, 박민수"></div>
  <div><label>장소 / 비고</label><input type="text" id="mPlace" placeholder="예: 본사 3층 회의실"></div>
</div>

<div class="opts dia">
  <span class="tag">화자 구분</span>
  <label><input type="radio" name="dmode" value="manual" checked> 수동 (버튼·단축키)</label>
  <label><input type="radio" name="dmode" value="auto"> <b>자동 (목소리 분석)</b></label>
  <span id="autoOpts" class="collapsed" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <label>민감도 <input type="range" id="thr" min="0.15" max="0.95" step="0.05" value="0.45"><span id="thrV">0.45</span></label>
    <label><input type="checkbox" id="optLearn" checked> 온라인 학습</label>
    <button id="enrollBtn" class="ghost" style="padding:6px 12px;font-size:12px">음성 등록</button>
    <button id="resetProf" class="ghost" style="padding:6px 12px;font-size:12px">프로필 초기화</button>
  </span>
</div>

<div id="enroll" class="collapsed">
  <b style="font-size:14px">참석자 음성 등록 <span class="small">(정확도가 크게 올라갑니다)</span></b>
  <p class="small" style="margin:6px 0">이름을 고르고 <b>3초 이상</b> 아무 말이나 하세요. 예: "안녕하세요, 저는 김철수입니다. 오늘 회의를 시작하겠습니다."</p>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <select id="eWho" style="min-width:150px"></select>
    <button id="eStart" style="background:#f97316;color:#fff;padding:8px 14px;font-size:13px">녹음 시작</button>
    <button id="eStop" class="ghost" disabled style="padding:8px 14px;font-size:13px">완료</button>
    <span id="eMsg" class="small">-</span>
  </div>
  <div id="emeter"><div id="ebar"></div></div>
  <table class="etable" id="eTable"></table>
</div>

<div class="opts fmt">
  <span class="tag">문장 정리</span>
  <label><input type="checkbox" id="optPunct" checked> 구두점 자동</label>
  <label><input type="checkbox" id="optBreak" checked> 문장별 줄바꿈</label>
  <label><input type="checkbox" id="optTs" checked> 타임스탬프</label>
  <label><input type="checkbox" id="optMark" checked> 액션·결정 하이라이트</label>
  <label>문단 침묵 <input type="range" id="gap" min="1" max="8" step="0.5" value="2.5"><span id="gapV">2.5초</span></label>
</div>

<div class="opts tr">
  <span class="tag">선택 기능</span>
  <label><input type="checkbox" id="optTrans"> <b>영어 번역</b></label>
  <span id="trOpts" class="collapsed" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <label><input type="checkbox" id="autoSpeak"> 읽어주기</label>
    <label>목소리 <select id="voice" style="max-width:180px"></select></label>
    <label>속도 <input type="range" id="rate" min="0.5" max="1.8" step="0.1" value="1"><span id="rateV">1.0</span></label>
    <button id="speakAll" class="ghost" style="padding:6px 12px;font-size:13px">전체 듣기</button>
    <button id="stopSpeak" class="ghost" style="padding:6px 12px;font-size:13px">중지</button>
  </span>
</div>

<div class="bar">
  <button id="start">● 녹음 시작</button>
  <button id="stop" disabled>■ 정지</button>
  <select id="lang">
    <option value="ko-KR">한국어</option><option value="en-US">English</option>
    <option value="ja-JP">日本語</option><option value="zh-CN">中文</option>
  </select>
  <span id="timer">00:00:00</span>
  <button id="clear" class="ghost">전체 지우기</button>
  <span id="status"><span class="dot" id="dot"></span>대기 중</span>
</div>

<div class="bar" style="margin-top:0" id="manualBar">
  <span style="font-size:12px;color:#64748b;font-weight:600">발언자</span>
  <div class="spkbtns" id="spkbtns"></div>
  <button id="addSpk" class="ghost" style="padding:6px 10px;font-size:12px">+ 추가</button>
</div>

<div class="grid" id="grid">
  <div class="panel">
    <h2><span>회의록 본문</span><span id="cnt1">0자 · 0발언</span></h2>
    <div class="box" id="src"></div>
    <div class="savebar">
      <button data-save="src" data-ext="txt">TXT</button>
      <button id="saveMd">회의록 Markdown</button>
      <button id="saveCsv">CSV</button>
      <button id="saveJson">JSON</button>
      <button data-save="src" data-ext="copy">전체 복사</button>
    </div>
  </div>
  <div class="panel collapsed" id="dstPanel">
    <h2><span>English <span style="font-weight:400">— 클릭 시 재생</span></span><span id="cnt2">0자</span></h2>
    <div class="box" id="dst"></div>
    <div class="savebar">
      <button data-save="dst" data-ext="txt">TXT</button>
      <button data-save="dst" data-ext="copy">복사</button>
    </div>
  </div>
</div>

<p class="legend">
  <span><span class="chip" style="background:#fef9c3;border:1px solid #eab308"></span>액션 아이템</span>
  <span><span class="chip" style="background:#dcfce7;border:1px solid #22c55e"></span>결정 사항</span>
  <span>발언자 배지를 <b>클릭</b>하면 수정됩니다 · 수동 모드 단축키 <b>1~5</b></span>
</p>
<p id="err"></p>

<script>
/* ===================== 공통 상태 ===================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;
const $ = id => document.getElementById(id);

let recog = null, running = false;
let rows = [];
let translator = null, translatorLang = null;
let speaking = false, speakIdx = -1, voices = [], queue = [];
let lastFinalAt = 0, paraNo = 0, lastSpk = -1;
let speakers = ['발언자 1', '발언자 2'];
let curSpk = 0, startedAt = null, timerId = null;

if (!SR) { $('err').textContent = '이 브라우저는 Web Speech API를 지원하지 않습니다. Chrome/Edge를 사용하세요.'; $('start').disabled = true; }
const hasTranslator = ('Translator' in self) || ('translation' in self);

/* ============================================================
   화자 자동 구분 엔진
   ------------------------------------------------------------
   특징 벡터 (10차원):
     [0]   기본 주파수 F0 (자기상관 기반, 정규화)
     [1]   F0 변동성
     [2]   스펙트럼 중심 (음색 밝기)
     [3]   스펙트럼 확산
     [4]   스펙트럼 롤오프 85%
     [5]   영교차율
     [6-9] 4밴드 로그 에너지 비율 (포먼트 대역 근사)
   ============================================================ */
const Dia = {
  ctx: null, stream: null, analyser: null, src: null,
  frames: [],            // 최근 프레임 특징 버퍼
  profiles: [],          // { spk, vec, n }  화자 프로필 (running mean)
  running: false, rafId: null, level: 0,

  async init() {
    if (this.ctx) return true;
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false }
      });
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.src = this.ctx.createMediaStreamSource(this.stream);
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 2048;
      this.analyser.smoothingTimeConstant = 0.2;
      this.src.connect(this.analyser);
      this.loop();
      return true;
    } catch (e) {
      $('err').textContent = '화자 분석용 마이크 접근 실패: ' + e.message;
      return false;
    }
  },

  /* ---- 자기상관 피치 추정 ---- */
  pitch(buf, sr) {
    const SIZE = buf.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.008) return -1;                      // 무음

    let r1 = 0, r2 = SIZE - 1;
    while (r1 < SIZE / 2 && Math.abs(buf[r1]) < 0.2) r1++;
    while (r2 > SIZE / 2 && Math.abs(buf[r2]) < 0.2) r2--;
    const b = buf.slice(r1, r2), n = b.length;
    if (n < 256) return -1;

    const c = new Float32Array(n).fill(0);
    for (let lag = 0; lag < n; lag++)
      for (let i = 0; i < n - lag; i++) c[lag] += b[i] * b[i + lag];

    let d = 0; while (d < n - 1 && c[d] > c[d + 1]) d++;
    let maxV = -1, maxP = -1;
    for (let i = d; i < n; i++) if (c[i] > maxV) { maxV = c[i]; maxP = i; }
    if (maxP <= 0 || maxV / c[0] < 0.35) return -1;

    // 포물선 보간
    const x1 = c[maxP-1] || 0, x2 = c[maxP], x3 = c[maxP+1] || 0;
    const a = (x1 + x3 - 2*x2) / 2, bb = (x3 - x1) / 2;
    const T = a ? maxP - bb / (2*a) : maxP;
    const f = sr / T;
    return (f > 60 && f < 450) ? f : -1;            // 사람 음성 범위
  },

  /* ---- 프레임 1개 특징 추출 ---- */
  frame() {
    const sr = this.ctx.sampleRate;
    const N = this.analyser.fftSize;
    const time = new Float32Array(N);
    const freq = new Float32Array(this.analyser.frequencyBinCount);
    this.analyser.getFloatTimeDomainData(time);
    this.analyser.getFloatFrequencyData(freq);

    let rms = 0, zc = 0;
    for (let i = 0; i < N; i++) {
      rms += time[i] * time[i];
      if (i && (time[i] >= 0) !== (time[i-1] >= 0)) zc++;
    }
    rms = Math.sqrt(rms / N);
    this.level = Math.min(100, rms * 400);
    if (rms < 0.012) return null;                    // 발화 아님

    const f0 = this.pitch(time, sr);
    if (f0 < 0) return null;                         // 유성음 아님

    // 스펙트럼 통계 (dB → 선형 가중)
    const binHz = sr / 2 / freq.length;
    let tot = 0, cen = 0;
    const mag = new Float32Array(freq.length);
    for (let i = 0; i < freq.length; i++) {
      const m = Math.pow(10, freq[i] / 20);
      mag[i] = m; tot += m; cen += m * i * binHz;
    }
    if (tot <= 0) return null;
    cen /= tot;

    let spread = 0;
    for (let i = 0; i < freq.length; i++) spread += mag[i] * (i*binHz - cen) ** 2;
    spread = Math.sqrt(spread / tot);

    let acc = 0, roll = 0;
    for (let i = 0; i < freq.length; i++) { acc += mag[i]; if (acc >= tot * 0.85) { roll = i*binHz; break; } }

    // 포먼트 근사 4밴드 (0.3k / 0.3-1k / 1-2.5k / 2.5-5k)
    const edges = [0, 300, 1000, 2500, 5000];
    const bands = [0,0,0,0];
    for (let i = 0; i < freq.length; i++) {
      const hz = i * binHz;
      for (let b = 0; b < 4; b++) if (hz >= edges[b] && hz < edges[b+1]) { bands[b] += mag[i]; break; }
    }
    const bsum = bands.reduce((a,b) => a+b, 0) || 1;

    return {
      f0,
      v: [ f0 / 300, 0, cen / 4000, spread / 3000, roll / 6000, zc / N,
           bands[0]/bsum, bands[1]/bsum, bands[2]/bsum, bands[3]/bsum ]
    };
  },

  loop() {
    this.rafId = requestAnimationFrame(() => this.loop());
    if (!this.analyser) return;
    const f = this.frame();
    if (f) { this.frames.push({ ...f, t: performance.now() }); if (this.frames.length > 600) this.frames.shift(); }
    if (enrolling) $('ebar').style.width = this.level + '%';
  },

  /* ---- 최근 ms 구간을 하나의 임베딩으로 집계 ---- */
  embed(sinceMs = 6000) {
    const now = performance.now();
    const fs = this.frames.filter(f => now - f.t <= sinceMs);
    if (fs.length < 12) return null;                 // 표본 부족

    // F0 중앙값 ±40% 밖 프레임 제거 (옥타브 오류·잡음 방어)
    const f0s = fs.map(f => f.f0).sort((a,b) => a-b);
    const med = f0s[Math.floor(f0s.length/2)];
    const keep = fs.filter(f => Math.abs(f.f0 - med) / med < 0.4);
    if (keep.length < 10) return null;

    const D = keep[0].v.length;
    const m = new Array(D).fill(0);
    keep.forEach(f => f.v.forEach((x, i) => m[i] += x));
    for (let i = 0; i < D; i++) m[i] /= keep.length;

    // [1] = F0 변동성 (표준편차)
    const sd = Math.sqrt(keep.reduce((a,f) => a + (f.f0 - med)**2, 0) / keep.length);
    m[1] = Math.min(1, sd / 60);
    m[0] = med / 300;
    return { v: m, n: keep.length, f0: med };
  },

  /* ---- 가중 거리 (F0 비중 높임) ---- */
  dist(a, b) {
    const W = [3.2, 1.0, 1.6, 0.9, 1.1, 0.7, 1.3, 1.3, 1.3, 1.3];
    let s = 0, wsum = 0;
    for (let i = 0; i < a.length; i++) { s += W[i] * (a[i]-b[i])**2; wsum += W[i]; }
    return Math.sqrt(s / wsum) * 3;                  // 0~1 스케일 근사
  },

  /* ---- 화자 판정 ---- */
  identify() {
    const e = this.embed();
    if (!e) return { spk: null, conf: 0 };

    if (!this.profiles.length) {
      this.profiles.push({ spk: 0, vec: e.v.slice(), n: e.n });
      return { spk: 0, conf: 1 };
    }

    let best = null, bestD = Infinity, second = Infinity;
    this.profiles.forEach(p => {
      const d = this.dist(e.v, p.vec);
      if (d < bestD) { second = bestD; bestD = d; best = p; }
      else if (d < second) second = d;
    });

    const thr = parseFloat($('thr').value);

    // 임계값 초과 → 새 화자 생성 (최대 5)
    if (bestD > thr && this.profiles.length < 5) {
      const used = new Set(this.profiles.map(p => p.spk));
      let idx = 0; while (used.has(idx)) idx++;
      if (idx >= speakers.length) { speakers.push('발언자 ' + (idx+1)); renderSpkBtns(); fillEnrollSelect(); }
      this.profiles.push({ spk: idx, vec: e.v.slice(), n: e.n });
      return { spk: idx, conf: 0.5 };
    }

    // 온라인 학습: 프로필을 지수이동평균으로 갱신
    if ($('optLearn').checked && bestD < thr * 0.8) {
      const a = 0.15;
      best.vec = best.vec.map((x, i) => x * (1-a) + e.v[i] * a);
      best.n += e.n;
    }

    // 신뢰도: 1등과 2등의 격차 기반
    const conf = second === Infinity ? 0.75
               : Math.max(0, Math.min(1, (second - bestD) / Math.max(second, 0.001)));
    return { spk: best.spk, conf: Math.max(0.1, conf) };
  },

  /* ---- 등록 모드: 지정 화자 프로필 확정 ---- */
  enroll(spkIdx, ms) {
    const e = this.embed(ms);
    if (!e) return false;
    const ex = this.profiles.find(p => p.spk === spkIdx);
    if (ex) { ex.vec = e.v.slice(); ex.n = e.n; }
    else this.profiles.push({ spk: spkIdx, vec: e.v.slice(), n: e.n });
    return true;
  },

  stop() {
    cancelAnimationFrame(this.rafId);
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    if (this.ctx) this.ctx.close();
    this.ctx = this.stream = this.analyser = null;
    this.frames = [];
  }
};

/* ===================== 구두점 / 분류 ===================== */
const QUESTION = {
  ko:{tail:/(까|까요|나요|가요|니|냐|죠|지요|런가|ㄹ까|세요)\s*$/,word:/^(뭐|무엇|무슨|어디|언제|누가|누구|왜|어떻게|어떤|얼마|몇)\b/},
  ja:{tail:/(か|かな|ですか|ますか)\s*$/,word:/^(何|どこ|いつ|誰|なぜ|どう|いくら)/},
  zh:{tail:/(吗|呢|吧)\s*$/,word:/^(什么|哪里|谁|为什么|怎么|多少)/},
  en:{tail:/$^/,word:/^(what|where|when|who|why|how|is|are|do|does|did|can|could|would|should)\b/i}
};
const EXCLAIM = {ko:/^(와|우와|헐|대박|오)\b|(구나|네요)\s*$/,ja:/^(わあ|すごい)/,zh:/^(哇|天啊)/,en:/^(wow|oh|hey)\b/i};
function punctuate(t0, code) {
  let t = t0.trim();
  if (!t || !$('optPunct').checked) return t;
  if (/[.!?。！？…]$/.test(t)) return t;
  const Q = QUESTION[code]||QUESTION.en, E = EXCLAIM[code]||EXCLAIM.en, cjk = code==='ja'||code==='zh';
  if (Q.tail.test(t)||Q.word.test(t)) return t + (cjk?'？':'?');
  if (E.test(t)) return t + (cjk?'！':'!');
  return t + (cjk?'。':'.');
}
const COMMA_KO = /\s(그리고|그런데|그래서|하지만|근데|또한|즉|따라서|왜냐하면)\s/g;
function commafy(t, code) {
  if (!$('optPunct').checked || code!=='ko' || t.length<25) return t;
  return t.replace(COMMA_KO, (m,w) => ', ' + w + ' ');
}
const RE_ACTION   = /(하기로 (했|하|합)|해야 (합니다|한다|돼요|됩니다)|진행(하겠|해 주|해주|할)|준비(하|해)|확인(하|해)|공유(하|해)|전달(하|해)|검토(하|해)|까지\s*(완료|마무리|제출)|담당(은|자)|액션\s*아이?템|follow[- ]?up|todo)/i;
const RE_DECISION = /(결정(했|됐|되었|합니다|입니다)|확정(했|됐|입니다|되었)|합의(했|됐|되었)|승인(했|됐|되었)|채택|최종(적으로)?\s*(결론|결정)|결론(은|적으로)|반려|보류하기로)/i;
function classify(t) {
  if (!$('optMark').checked) return '';
  if (RE_DECISION.test(t)) return 'decision';
  if (RE_ACTION.test(t)) return 'action';
  return '';
}
const TOPIC_SHIFT = /^(그래서|그러면|그럼|다음으로|자|이제|첫째|둘째|셋째|마지막으로|결론적으로|정리하면|참고로|안건)\b/;
function isNewParagraph(text, now, spk) {
  if (!rows.length) return true;
  if (spk !== lastSpk) return true;
  if ((now - lastFinalAt)/1000 >= parseFloat($('gap').value)) return true;
  if (TOPIC_SHIFT.test(text.trim())) return true;
  const cur = rows.filter(r => r.para === paraNo);
  if (cur.reduce((a,r) => a + r.text.length, 0) > 420) return true;
  return false;
}

}

    return;

async function getTranslator(srcLang) {
  const code = srcLang.split('-')[0];
  if (code === 'en') return null;
  if (translator && translatorLang === code) return translator;
  if (!hasTranslator) return null;
  try {
    const opts = { sourceLanguage: code, targetLanguage: 'en' };
    const API = self.Translator || self.translation;
    const avail = await API.availability(opts);
    if (avail === 'unavailable') { $('err').textContent = code+' → en 번역 모델 미지원'; return null; }
    if (avail !== 'available') setStatus('번역 모델 다운로드 중…', false);
    translator = await API.create({ ...opts, monitor(m){ m.addEventListener('downloadprogress',
      e => setStatus('모델 다운로드 ' + Math.round(e.loaded*100) + '%', false)); } });
    translatorLang = code; setStatus(running?'듣는 중…':'대기 중', running);
    return translator;
  } catch(e) { $('err').textContent = '번역기 초기화 실패: ' + e.message; return null; }
}
async function safeTranslate(text) {
  const tr = await getTranslator($('lang').value);
  if (!tr) return '';
  try {
    let en = (await tr.translate(text)).trim();
    if (en && !/[.!?]$/.test(en)) en += ({'？':'?','?':'?','！':'!','!':'!'})[text.slice(-1)] || '.';
    return en.charAt(0).toUpperCase() + en.slice(1);
  } catch { return '[번역 실패]'; }
}

/* ===================== 렌더링 ===================== */
function esc(s){ return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function groupByPara() {
  const g=[];
  rows.forEach((r,i)=>{ if(!g.length||g[g.length-1].para!==r.para) g.push({para:r.para,spk:r.spk,conf:r.conf,items:[]});
    g[g.length-1].items.push({...r,i}); });

}

    return `<p class="para">${head}` +
      g.items.map(it=>`<span class="line ${it.kind}">${esc(it.text)}</span>`).join(brk?'':' ') + '</p>';
  }).join('') + (interim?`<p class="para interim">${esc(interim)}</p>`:'');

  if ($('optTrans').checked) {
    $('dst').innerHTML = groups.map(g =>
      `<p class="para"><div class="phead"><span class="spk s${g.spk%5}">${esc(speakers[g.spk]||'Speaker')}</span></div>` +
      g.items.map(it => !it.en ? '<span class="pending line">translating…</span>'
        : `<span class="seg line${it.i===speakIdx?' speaking':''}" data-i="${it.i}">${esc(it.en)}</span>`).join(brk?'':' ') +
      '</p>').join('');
    $('cnt2').textContent = rows.map(r=>r.en||'').join('').length+'자';
  }
  $('cnt1').textContent = rows.map(r=>r.text).join('').length+'자 · '+rows.length+'발언';

/* ===================== 파이프라인 ===================== */
async function pushRow(raw) {
  const code = $('lang').value.split('-')[0], now = Date.now();

  let spk = curSpk, conf = null;
  if (autoMode && Dia.ctx) {
    const r = Dia.identify();
    if (r.spk != null) { spk = r.spk; conf = r.conf; curSpk = spk; renderSpkBtns(); }
  }

  if (isNewParagraph(raw, now, spk)) paraNo++;
  lastFinalAt = now; lastSpk = spk;

  const clean = punctuate(commafy(raw.trim(), code), code);
  const row = { text:clean, en:'', para:paraNo, spk, conf,
                t:new Date().toISOString(), elapsed:fmtEl(now-(startedAt||now)), kind:classify(clean) };
  rows.push(row);
  const idx = rows.length-1;
  render('');
  renderETable();

  if (!$('optTrans').checked) return;
  row.en = await safeTranslate(clean);
  render('');
  if ($('autoSpeak').checked && row.en && row.en!=='[번역 실패]')
    speaking ? queue.push({text:row.en,idx}) : speak(row.en, idx);
}

/* ===================== 음성 인식 ===================== */
function build() {
  const r = new SR();
  r.lang=$('lang').value; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;
  r.onstart = () => { if(!speaking) setStatus('듣는 중…', true); };
  r.onresult = e => {
    if (speaking) return;
    let interim='';
    for (let i=e.resultIndex;i<e.results.length;i++) {
      const t = e.results[i][0].transcript.trim();
      if (e.results[i].isFinal) { if(t) pushRow(t); } else interim += e.results[i][0].transcript;
    }
    if (interim) render(interim);
  };
  r.onerror = e => {
    if (e.error==='aborted'||e.error==='no-speech') return;
    $('err').textContent = {
      'not-allowed':'마이크 권한이 거부되었습니다. 주소창 자물쇠 아이콘에서 허용하세요.',
      'audio-capture':'마이크 장치를 찾을 수 없습니다.',
      'network':'네트워크 오류가 발생했습니다.'
    }[e.error] || ('오류: '+e.error);
  };
  r.onend = () => {
    if (running && !speaking) { try{ r.start(); }catch(_){} }
    else if (!running) setStatus('대기 중', false);
  };
  return r;
}
$('start').onclick = async () => {
  $('err').textContent='';
  running = true;
  if (!startedAt) { startedAt=Date.now(); timerId=setInterval(tick,1000); }
  lastFinalAt = Date.now();

  if ($('optTrans').checked) await getTranslator($('lang').value);
  recog = build(); recog.start();
  $('start').disabled=true; $('stop').disabled=false; $('lang').disabled=true;
};
$('stop').onclick = () => {
  running=false; if (recog) recog.stop();
  $('start').disabled=false; $('stop').disabled=true; $('lang').disabled=false;
};
$('clear').onclick = () => {
  if (rows.length && !confirm('회의록 내용을 모두 지울까요?')) return;
  stopSpeaking(); rows=[]; paraNo=0; lastSpk=-1;
  startedAt=null; clearInterval(timerId); $('timer').textContent='00:00:00';
  render(''); $('err').textContent='';
};

/* ===================== 저장 ===================== */
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function download(name,content,mime){
  const b=new Blob(['\uFEFF'+content],{type:mime+';charset=utf-8'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function bodyText(which){
  const ts=$('optTs').checked;
  return groupByPara().map(g=>{
    const head = `[${speakers[g.spk]||'발언자'}]` + (ts?` ${g.items[0].elapsed}`:'');
    const lines = g.items.map(it=>which==='src'?it.text:(it.en||'')).filter(Boolean);
    return lines.length ? head+'\n'+lines.join($('optBreak').checked?'\n':' ') : '';
  }).filter(Boolean).join('\n\n');
}
function header(){ const d=new Date();
  return { title:$('mTitle').value.trim()||'회의록', attend:$('mAttend').value.trim(),
           place:$('mPlace').value.trim(), date:d.toLocaleDateString('ko-KR'), dur:$('timer').textContent }; }
document.querySelectorAll('[data-save]').forEach(btn=>{
  btn.onclick = async () => {
    const w=btn.dataset.save, text=bodyText(w).trim();
    if (!text) { $('err').textContent='저장할 내용이 없습니다.'; return; }
    if (btn.dataset.ext==='copy') {
      await navigator.clipboard.writeText(text);
      setStatus('복사됨',false); setTimeout(()=>setStatus(running?'듣는 중…':'대기 중',running),1200);
    } else {
      const h=header();
      const head = w==='src' ? `${h.title}\n일시: ${h.date} (${h.dur})\n참석: ${h.attend}\n장소: ${h.place}\n${'='.repeat(40)}\n\n` : '';
      download(`${w==='src'?'minutes':'minutes_en'}_${stamp()}.txt`, head+text, 'text/plain');
    }
  };
});
$('saveMd').onclick = () => {
  if (!rows.length) { $('err').textContent='저장할 내용이 없습니다.'; return; }
  const h=header(), act=rows.filter(r=>r.kind==='action'), dec=rows.filter(r=>r.kind==='decision');
  let md = `# ${h.title}\n\n| 항목 | 내용 |\n| --- | --- |\n| 일시 | ${h.date} |\n| 소요 시간 | ${h.dur} |\n| 참석자 | ${h.attend||'-'} |\n| 장소 | ${h.place||'-'} |\n| 화자 구분 | ${autoMode?'자동 (음성 분석)':'수동'} |\n\n`;
  if (dec.length) md += `## 결정 사항\n\n`+dec.map(r=>`- ${r.text} *(${speakers[r.spk]}, ${r.elapsed})*`).join('\n')+'\n\n';
  if (act.length) md += `## 액션 아이템\n\n`+act.map(r=>`- [ ] ${r.text} *(${speakers[r.spk]}, ${r.elapsed})*`).join('\n')+'\n\n';
  md += `## 발언 전문\n\n`+groupByPara().map(g=>
    `**${speakers[g.spk]||'발언자'}** \`${g.items[0].elapsed}\`\n\n`+
    g.items.map(it=>it.text).join($('optBreak').checked?'\n':' ')).join('\n\n');
  if ($('optTrans').checked && rows.some(r=>r.en)) md += `\n\n## English Transcript\n\n`+bodyText('dst');
  download(`minutes_${stamp()}.md`, md, 'text/markdown');
};
$('saveCsv').onclick = () => {
  if (!rows.length) return;
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  download(`minutes_${stamp()}.csv`,
    ['no,elapsed,time,speaker,confidence,corrected,type,text,english',
     ...rows.map((r,i)=>[i+1,r.elapsed,q(r.t),q(speakers[r.spk]),
       r.conf!=null?Math.round(r.conf*100):'', r.corrected?'Y':'', r.kind||'-',q(r.text),q(r.en)].join(','))
    ].join('\n'),'text/csv');
};
$('saveJson').onclick = () => {
  if (!rows.length) return;
  download(`minutes_${stamp()}.json`,
    JSON.stringify({ meta:header(), diarization:autoMode?'auto':'manual', speakers, rows }, null, 2),'application/json');
};
window.addEventListener('beforeunload', e => {
  if (synth) synth.cancel();
  if (rows.length) { e.preventDefault(); e.returnValue=''; }
});
render(''); fillEnrollSelect(); renderETable();
</script>
</body>
</html>
